name: flutter_rtmp_broadcaster
description: "Flutter plugin for RTMP broadcasting with native sponsor + scoreband overlay compositing."
version: 0.1.0
homepage:

environment:
  sdk: ">=3.10.0 <4.0.0"
  flutter: ">=3.38.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.flutterrtmp.broadcaster
        pluginClass: FlutterRtmpBroadcasterPlugin
      ios:
        pluginClass: FlutterRtmpBroadcasterPlugin
